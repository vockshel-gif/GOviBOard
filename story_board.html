<title>Govi Thena Story Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Sinhala:wght@500;600&display=swap">
<style>
/* Layout: one endless canvas. The story runs left to right along a single journey line; each part is a tinted band (day, dusk, night, deep time); holes hang under the beat they belong to and glow like the blue light. */
:root{
  --ground:#e6e4d6; --dot:rgba(50,56,38,.17);
  --card:#fcfbf6; --edge:rgba(36,40,28,.13); --shadow:rgba(30,34,20,.16); --scrim:rgba(24,28,18,.38);
  --ink:#1c211b; --muted:#5a6155; --faint:#80877a;
  --path:#9a7a32;
  --light:#2a5ff0; --on-light:#ffffff; --light-soft:rgba(42,95,240,.09); --light-glow:rgba(42,95,240,.30);
  --built:#3b7432; --built-soft:rgba(59,116,50,.12);
  --planned:#8e600c; --planned-soft:rgba(148,101,15,.13);
  --stale:#b3441c; --stale-soft:rgba(179,68,28,.11);
  --z-deep:#d6d4cb; --z-day:#d9e2c3; --z-dusk:#e6d7c1; --z-night:#1f2546;
  --z-ink:#1c211b; --z-muted:#5a6155; --z-night-ink:#e9ecf8; --z-night-muted:#aab1d2;
  --note:#f3e29a; --note-ink:#352d0c; --note-edge:rgba(80,64,0,.2);
  --bar:#f4f3ec; --bar-edge:rgba(36,40,28,.12);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-hand:"Caveat","Noto Sans Sinhala","Segoe Print",cursive;
  --f-sinhala:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0f1311; --dot:rgba(220,230,210,.08);
    --card:#1b211d; --edge:rgba(230,240,220,.10); --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
    --ink:#e6e9df; --muted:#a2aa9a; --faint:#7d8576;
    --path:#c8a250;
    --light:#7598ff; --on-light:#0b1230; --light-soft:rgba(117,152,255,.11); --light-glow:rgba(117,152,255,.30);
    --built:#82c46f; --built-soft:rgba(130,196,111,.13);
    --planned:#dcaa48; --planned-soft:rgba(220,170,72,.13);
    --stale:#ef8256; --stale-soft:rgba(239,130,86,.13);
    --z-deep:#18191d; --z-day:#152016; --z-dusk:#211b15; --z-night:#111631;
    --z-ink:#e6e9df; --z-muted:#a2aa9a; --z-night-ink:#e9ecf8; --z-night-muted:#9aa3c9;
    --note:#e8d47e; --note-ink:#2d260a; --note-edge:rgba(0,0,0,.3);
    --bar:#141917; --bar-edge:rgba(230,240,220,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0f1311; --dot:rgba(220,230,210,.08);
  --card:#1b211d; --edge:rgba(230,240,220,.10); --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
  --ink:#e6e9df; --muted:#a2aa9a; --faint:#7d8576;
  --path:#c8a250;
  --light:#7598ff; --on-light:#0b1230; --light-soft:rgba(117,152,255,.11); --light-glow:rgba(117,152,255,.30);
  --built:#82c46f; --built-soft:rgba(130,196,111,.13);
  --planned:#dcaa48; --planned-soft:rgba(220,170,72,.13);
  --stale:#ef8256; --stale-soft:rgba(239,130,86,.13);
  --z-deep:#18191d; --z-day:#152016; --z-dusk:#211b15; --z-night:#111631;
  --z-ink:#e6e9df; --z-muted:#a2aa9a; --z-night-ink:#e9ecf8; --z-night-muted:#9aa3c9;
  --note:#e8d47e; --note-ink:#2d260a; --note-edge:rgba(0,0,0,.3);
  --bar:#141917; --bar-edge:rgba(230,240,220,.10);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--light);outline-offset:2px}

/* top bar */
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--bar-edge);position:relative;z-index:6}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand b{font-family:var(--f-display);font-weight:760;font-size:20px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.parts{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1 1 300px;scrollbar-width:none;padding-block:2px}
.parts::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px/1 var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--bar-edge);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip[aria-current="true"]{color:var(--ink);background:var(--card);border-color:var(--faint)}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{width:72px;height:6px;border-radius:3px;background:var(--light-soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--light-soft)}
.meter i{display:block;height:100%;width:0;background:var(--light);transition:width .3s}
.btn{font:600 13px/1 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:9px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--light);color:var(--on-light);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.status{font:500 11.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.status.warn{color:var(--stale)}

/* canvas */
#viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--ground);background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);user-select:none;-webkit-user-select:none}
#viewport.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.layer{position:absolute;left:0;top:0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.w-line{stroke:var(--path);stroke-width:3;fill:none;stroke-linecap:round}
.w-chev{stroke:var(--path);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-hole{stroke:var(--light);stroke-width:2;stroke-dasharray:5 6;fill:none}
.w-dot{fill:var(--path)}

/* zones */
.zone{position:absolute;border-radius:40px;background:var(--zbg)}
.zone.tone-cast{background:transparent;border:2px dashed var(--edge);box-sizing:border-box}
.tone-cast,.tone-deep{--zbg:var(--z-deep);--zink:var(--z-ink);--zmuted:var(--z-muted)}
.tone-day{--zbg:var(--z-day);--zink:var(--z-ink);--zmuted:var(--z-muted)}
.tone-dusk{--zbg:var(--z-dusk);--zink:var(--z-ink);--zmuted:var(--z-muted)}
.tone-night{--zbg:var(--z-night);--zink:var(--z-night-ink);--zmuted:var(--z-night-muted)}
.zhead{position:absolute;color:var(--zink)}
.era{font:500 13px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--zmuted)}
.zhead h2{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.035em;margin:14px 0 16px;text-wrap:balance}
.zhead .sub{font:500 21px/1.35 var(--f-body);margin:0 0 18px;max-width:38ch}
.mood{display:flex;align-items:center;gap:8px;font:500 13px var(--f-mono);color:var(--zmuted);flex-wrap:wrap}
.mood .k{letter-spacing:.14em;text-transform:uppercase;margin-right:4px}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--edge)}
.gap{position:absolute;width:200px;margin-left:-100px;text-align:center;font:500 12.5px/1.35 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* cards */
.card{position:absolute;width:272px;box-sizing:border-box;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px 18px 18px;box-shadow:0 1px 0 var(--edge),0 14px 28px -18px var(--shadow)}
.kicker{font:500 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:flex;gap:10px;align-items:center;margin-bottom:12px}
.kicker .no{color:var(--path);font-variant-numeric:tabular-nums}
.beat h3{font-family:var(--f-display);font-weight:720;font-size:22px;line-height:1.12;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.beat p{font-size:16px;line-height:1.45;margin:0}
.tags{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.tag{font-size:13px;line-height:1.38;padding:8px 10px;border-radius:8px}
.tag b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
.tag.built{background:var(--built-soft)} .tag.built b{color:var(--built)}
.tag.planned{background:var(--planned-soft)} .tag.planned b{color:var(--planned)}
.tag.stale{background:var(--stale-soft)} .tag.stale b{color:var(--stale)}

.hole{border:2px dashed var(--light);box-shadow:0 0 0 6px var(--light-soft),0 0 46px -10px var(--light-glow)}
.hole.filled{border-style:solid;box-shadow:0 0 0 4px var(--light-soft),0 14px 28px -18px var(--shadow)}
.hole .kicker{color:var(--light)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--light);box-shadow:0 0 0 0 var(--light-glow);animation:pulse 2.6s ease-out infinite}
.hole.filled .pulse{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--light-glow)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hole h4{font-family:var(--f-display);font-weight:650;font-size:19px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.hole .why{font-size:14px;line-height:1.42;color:var(--muted);margin:0 0 6px}
.hole textarea,.note textarea{user-select:text;-webkit-user-select:text}
.hole textarea{display:block;width:100%;box-sizing:border-box;resize:none;overflow:hidden;min-height:58px;font-family:var(--f-hand);font-weight:500;font-size:24px;line-height:1.2;color:var(--ink);background:var(--light-soft);border:0;border-radius:9px;padding:8px 11px;margin-top:8px}
.hole textarea:focus{outline:2px solid var(--light);outline-offset:1px}
.hole textarea::placeholder{color:var(--faint)}
.hole textarea[readonly]{background:transparent}
.idea{margin-top:10px;font-size:13.5px;line-height:1.42;color:var(--muted)}
.idea summary{cursor:pointer;font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.idea p{margin:6px 0 0}
.hole-foot{margin-top:9px;font:500 11px var(--f-mono);letter-spacing:.05em;color:var(--faint)}
.hole-foot.warn{color:var(--stale)}

.person h3{font-family:var(--f-display);font-weight:720;font-size:24px;line-height:1.1;margin:0}
.person .si{font-family:var(--f-sinhala);font-weight:600;font-size:18px;color:var(--muted);margin:4px 0 10px;min-height:1.3em}
.person .si.empty{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--light);padding-top:4px}
.person p{font-size:15px;line-height:1.45;margin:0}
.legend h3{font-family:var(--f-display);font-weight:720;font-size:22px;margin:0 0 12px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px;line-height:1.4}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend .mk{flex:none;width:28px;height:18px;border-radius:5px;margin-top:1px}
.mk.line{height:3px;margin-top:9px;background:var(--path);border-radius:2px}
.mk.built{background:var(--built-soft);box-shadow:inset 0 0 0 1px var(--built)}
.mk.planned{background:var(--planned-soft);box-shadow:inset 0 0 0 1px var(--planned)}
.mk.stale{background:var(--stale-soft);box-shadow:inset 0 0 0 1px var(--stale)}
.mk.hole{border:2px dashed var(--light);box-sizing:border-box}
.legend .how{margin-top:14px;padding-top:12px;border-top:1px solid var(--edge);font-size:13px;color:var(--muted);line-height:1.45}

/* notes */
.note{position:absolute;width:232px;background:var(--note);color:var(--note-ink);border-radius:4px 4px 14px 4px;box-shadow:0 0 0 1px var(--note-edge),0 16px 26px -16px var(--shadow);transform:rotate(-1.2deg)}
.note.lifted{transform:rotate(0) scale(1.02);box-shadow:0 0 0 1px var(--note-edge),0 22px 36px -16px var(--shadow)}
.note-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 0 12px;cursor:move;font:500 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;touch-action:none}
.note-head span{opacity:.7}
.note-del{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--note-ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;cursor:pointer;opacity:.65}
.note-del:hover{opacity:1;border-color:var(--note-edge)}
.note-del.armed{opacity:1;border-color:currentColor}
.note textarea{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;resize:none;overflow:hidden;font-family:var(--f-hand);font-weight:500;font-size:25px;line-height:1.18;color:var(--note-ink);padding:4px 12px 16px;min-height:84px}
.note textarea:focus{outline:none}
.note textarea::placeholder{color:var(--note-ink);opacity:.45}

/* floating controls */
.hud{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;align-items:center;background:var(--bar);border:1px solid var(--bar-edge);border-radius:12px;padding:5px;z-index:4;box-shadow:0 10px 24px -16px var(--shadow)}
.hud button{min-width:34px;height:34px;font:600 15px/1 var(--f-body);color:var(--ink);background:transparent;border:0;border-radius:8px;cursor:pointer;padding:0 10px}
.hud button:hover{background:var(--card)}
.hud .pct{font:500 12px var(--f-mono);color:var(--muted);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font:500 11.5px var(--f-mono);color:var(--muted);background:var(--bar);border:1px solid var(--bar-edge);border-radius:10px;padding:9px 12px;z-index:4;max-width:calc(100% - 300px)}
@media (max-width:720px){.hint{display:none}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.meter i{transition:none}}
/* copy-answers sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
.sheet[hidden]{display:none}
.sheet-box{width:min(640px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;background:var(--bar);border:1px solid var(--bar-edge);border-radius:16px;padding:18px;box-shadow:0 24px 60px -20px var(--shadow)}
.sheet-box h2{font-family:var(--f-display);font-weight:720;font-size:22px;line-height:1.15;margin:0}
.sheet-box p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.sheet-box textarea{flex:1 1 auto;min-height:200px;width:100%;box-sizing:border-box;resize:vertical;font:400 14px/1.5 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px 12px}
.sheet-row{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.sheet-row .status{margin-right:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div class="bar" role="toolbar" aria-label="Story board controls">
  <div class="brand"><b>Govi Thena</b><span>Story board</span></div>
  <nav class="parts" id="parts" aria-label="Jump to a part"></nav>
  <div class="tools">
    <div class="progress" aria-live="polite"><span class="meter"><i id="meter"></i></span><span id="progText">0 of 0 holes filled</span></div>
    <button class="btn primary" id="nextHole" type="button">Next hole</button>
    <button class="btn" id="addNote" type="button">Add note</button>
    <button class="btn" id="copyAll" type="button">Copy answers</button>
    <span class="status" id="status" role="status">Connecting…</span>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your answers</h2>
    <p>Every hole you've filled and every note, as plain text. Copy it and paste it to Claude in chat.</p>
    <textarea id="sheetText" readonly aria-labelledby="sheetTitle"></textarea>
    <div class="sheet-row">
      <span class="status" id="sheetMsg" role="status"></span>
      <button class="btn" id="sheetClose" type="button">Close</button>
      <button class="btn primary" id="sheetCopy" type="button">Copy</button>
    </div>
  </div>
</div>

<main id="viewport" aria-label="Story canvas">
  <div id="world">
    <div class="layer" id="layerZones"></div>
    <svg id="wires" aria-hidden="true"></svg>
    <div class="layer" id="layerCards"></div>
    <div class="layer" id="layerNotes"></div>
  </div>
  <div class="hint">Drag to move · Scroll or pinch to zoom · Double-click empty space to add a note</div>
  <div class="hud">
    <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
    <span class="pct" id="zoomPct">100%</span>
    <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
    <button type="button" id="fitAll">Whole story</button>
  </div>
</main>

<script>
(() => {
/* ------------------------------------------------------------------ story */
const STORY = [
  { id:'cast', kind:'cast', tone:'cast', chip:"Who's who", era:'Before you start', title:"Who's who",
    sub:'The family, the friend, the smith, and the ones who came back for their ship.',
    cards:[
      { legend:true },
      { name:'Putha', si:'පුතා', text:'The son, and the one you play. A young boy.' },

      { name:'Tata’s friend', friend:true, text:'Shot the alien by mistake. Found dead in the jungle. The village blames Tata.' },
      { name:'Kammala Baas', si:'කම්මල් බාස්', text:'The village smith. The only one who still deals with the family.' },
      { name:'The aliens', si:'', text:'Ethical. They take a life only for a life. They want their ship back.' },
    ]},
  { id:'ship', tone:'deep', chip:'Long ago', era:'Thousands of years ago', title:'The ship',
    sub:'Before any people lived here.', mood:'deep time · stone · silence', swatches:['#4a4e57','#8b8577','#1b2a3a'],
    gapBefore:'The story starts here',
    beats:[
      { id:'a1', title:'It comes on a mission', text:'A ship comes to this place on a mission. It doesn’t crash.' },
      { id:'a2', title:'It’s left in the ground', text:'The ship stays buried under the place that will one day be the village. Its entrance is at the bottom of what will be the wewa.' },
      { id:'a3', title:'Still brand new', text:'It’s never used. It still has all its fuel, so one day they’ll come back for it.' },
    ],
    holes:[
      { id:'mission', on:'a1', q:'What is the mission?', why:'It’s why they come back, and where the ship goes at the end.' },
      { id:'left-behind', on:'a2', q:'Why was it left here, unused?' },
    ]},
  { id:'night', tone:'night', chip:'1935', era:'1935', title:'The night',
    sub:'Tata and his friend, alone in the jungle.', mood:'thunder · lantern · blue light', swatches:['#10163a','#f2b44a','#3d7bff'],
    gapBefore:'Thousands of years pass',
    beats:[
      { id:'b1', title:'A small ship lands', text:'A small alien ship comes down near the village. An alien jumps out.' },
      { id:'b2', title:'The friend shoots', text:'Tata and his friend see it. The friend shoots it by mistake, and it dies.' },
      { id:'b3', title:'They hide the body', text:'They panic and hide it.' },
      { id:'b4', title:'Into the jungle', text:'That night they carry the body into the jungle to bury it.' },
      { id:'b5', title:'The blue light', text:'Another ship comes. Not the big mothership, an ordinary one. This is the blue light.',

/* ------------------------------------------------------------------ dom helpers */
const $ = (s) => document.querySelector(s);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ------------------------------------------------------------------ build */
const CW = 272, GX = 60, PAD = 56, ZGAP = 230, HOLE_DROP = 76, STACK = 24, CAST_COLS = 4, CAST_GX = 26;
const zones = [];
const holes = {};       // id -> record
const holeOrder = [];
let friendCard = null;
let beatNo = 0;

for (const z of STORY) {
  const zo = { data: z };
  zo.bg = h('div', { class: 'zone tone-' + z.tone });
  zo.head = h('header', { class: 'zhead tone-' + z.tone },
    h('div', { class: 'era', text: z.era }), h('h2', { text: z.title }), h('p', { class: 'sub', text: z.sub }));
  if (z.mood) {
    const m = h('div', { class: 'mood' }, h('span', { class: 'k', text: 'Mood' }));
    for (const c of z.swatches) { const s = h('span', { class: 'sw' }); s.style.background = c; m.append(s); }
    m.append(h('span', { text: z.mood }));
    zo.head.append(m);
  }
  layerZones.append(zo.bg);
  layerCards.append(zo.head);
  if (z.gapBefore) { zo.gap = h('div', { class: 'gap', text: z.gapBefore }); layerCards.append(zo.gap); }

  if (z.kind === 'cast') {
    zo.cards = z.cards.map(c => c.legend ? buildLegend() : buildPerson(c));
  } else {
    zo.cols = z.beats.map(b => ({ beat: buildBeat(b, ++beatNo, z), no: beatNo, id: b.id, holes: [] }));
    for (const ho of z.holes || []) {
      const col = zo.cols.find(c => c.id === ho.on);
      col.holes.push(buildHole(ho, col));
    }
    for (const col of zo.cols) for (const hc of col.holes) holeOrder.push(hc.dataset.hole);
  }
  zones.push(zo);
}

function buildLegend() {
  const el = h('article', { class: 'card legend' }, h('h3', { text: 'How to read this board' }));
  const ul = h('ul');
  const row = (cls, text) => ul.append(h('li', {}, h('span', { class: 'mk ' + cls }), h('span', { text })));
  row('line', 'The story runs left to right along this line.');
  row('built', 'In the game: already built.');
  row('planned', 'Planned: in your earlier plans, not built yet.');
  row('stale', 'Game says otherwise: the game’s text tells it differently.');
  row('hole', 'A hole. Type your answer in it. It saves by itself.');
  el.append(ul, h('div', { class: 'how', text: 'Drag to move around. Scroll or pinch to zoom. Use Next hole to jump to the next empty one. Double-click empty space to pin your own note.' }));
  layerCards.append(el);
  return el;
}
function buildPerson(c) {
  const si = h('div', { class: 'si', text: c.si || '' });
  const el = h('article', { class: 'card person' }, h('h3', { text: c.name }), si, h('p', { text: c.text }));
  if (c.friend) { friendCard = si; si.classList.add('empty'); si.textContent = 'No name yet'; }
  layerCards.append(el);
  return el;
}
function buildBeat(b, no, z) {
  const el = h('article', { class: 'card beat' },
    h('div', { class: 'kicker' }, h('span', { class: 'no', text: String(no).padStart(2, '0') }), h('span', { text: z.era })),
    h('h3', { text: b.title }), h('p', { text: b.text }));

    for (const t of b.tags) ul.append(h('li', { class: 'tag ' + t.k }, h('b', { text: TAG[t.k] }), document.createTextNode(t.t)));
    el.append(ul);

  return el;
}
function buildHole(ho, col) {
  const qid = 'q-' + ho.id;
  const el = h('article', { class: 'card hole', 'data-hole': ho.id },
    h('div', { class: 'kicker' }, h('span', { class: 'pulse', 'aria-hidden': 'true' }), h('span', { text: 'Hole · beat ' + String(col.no).padStart(2, '0') })),
    h('h4', { id: qid, text: ho.q }));
  if (ho.why) el.append(h('p', { class: 'why', text: ho.why }));
  const ta = h('textarea', { id: 'ans-' + ho.id, rows: '2', placeholder: 'Write it here…', 'aria-labelledby': qid });
  el.append(ta);
  if (ho.idea) {
    const d = h('details', { class: 'idea' }, h('summary', { text: 'One idea (Claude’s, not canon)' }), h('p', { text: ho.idea }));
    d.addEventListener('toggle', scheduleLayout);
    el.append(d);
  }
  const foot = h('div', { class: 'hole-foot', text: 'Empty' });
  el.append(foot);
  layerCards.append(el);
  const r = { id: ho.id, q: ho.q, el, ta, foot, col, saved: '', writing: false, again: false, timer: 0, retried: false };
  holes[ho.id] = r;
  ta.addEventListener('input', () => { autosize(ta); queueHole(r); refreshHole(r); scheduleLayout(); });
  ta.addEventListener('blur', () => flushHole(r));
  return el;
}

/* ------------------------------------------------------------------ layout */
let bounds = { x: 0, y: 0, w: 1000, h: 1000 }, castRect = null, zoneH = 1000;
let layoutQueued = false;
function scheduleLayout() { if (layoutQueued) return; layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); }

function layout() {
  for (const zo of zones) {
    const cast = zo.data.kind === 'cast';
    const n = cast ? CAST_COLS : zo.cols.length;
    zo.innerW = n * CW + (n - 1) * (cast ? CAST_GX : GX);
    zo.w = zo.innerW + PAD * 2;
    zo.head.style.width = zo.innerW + 'px';
  }
  const headH = Math.max(...zones.map(zo => zo.head.offsetHeight));
  const top = PAD + headH + 52;
  const lineY = top + 26;
  let x = 0, maxB = 0;
  for (const zo of zones) {
    zo.x = x;
    place(zo.head, x + PAD, PAD);
    if (zo.data.kind === 'cast') {
      let y = top;
      for (let r = 0; r * CAST_COLS < zo.cards.length; r++) {
        const row = zo.cards.slice(r * CAST_COLS, (r + 1) * CAST_COLS);
        row.forEach((c, i) => place(c, x + PAD + i * (CW + CAST_GX), y));
        y += Math.max(...row.map(c => c.offsetHeight)) + CAST_GX;
      }
      zo.bottom = y - CAST_GX + PAD;
    } else {
      for (const [i, col] of zo.cols.entries()) {
        col.x = x + PAD + i * (CW + GX);
        col.top = top;
        place(col.beat, col.x, top);
        col.beatBottom = top + col.beat.offsetHeight;
      }
      const rowB = Math.max(...zo.cols.map(c => c.beatBottom));
      for (const col of zo.cols) {
        let y = rowB + HOLE_DROP;
        col.spans = [];
        for (const hc of col.holes) { place(hc, col.x, y); col.spans.push([y, y + hc.offsetHeight]); y += hc.offsetHeight + STACK; }
        col.bottom = col.holes.length ? y - STACK : col.beatBottom;
        maxB = Math.max(maxB, col.bottom);
      }
    }
    if (zo.gap) place(zo.gap, x - ZGAP / 2, lineY - 58);
    x += zo.w + ZGAP;
  }
  zoneH = maxB + PAD;
  for (const zo of zones) {
    const hh = zo.data.kind === 'cast' ? zo.bottom : zoneH;
    Object.assign(zo.bg.style, { left: zo.x + 'px', top: '0px', width: zo.w + 'px', height: hh + 'px' });
  }
  bounds = { x: 0, y: 0, w: x - ZGAP, h: zoneH };
  castRect = { x: zones[0].x, y: 0, w: zones[0].w, h: zones[0].bottom };
  drawWires(lineY);
}

function drawWires(lineY) {
  const NS = 'http://www.w3.org/2000/svg';
  wires.setAttribute('width', bounds.w);
  wires.setAttribute('height', bounds.h);
  wires.replaceChildren();
  const add = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); wires.append(e); };
  const cols = zones.filter(z => z.cols).flatMap(z => z.cols);
  const x1 = cols[0].x - ZGAP / 2 - 70, x2 = cols.at(-1).x + CW + 70;
  add('path', { d: `M${x1} ${lineY} H${x2}`, class: 'w-line' });
  add('circle', { cx: x1, cy: lineY, r: 7, class: 'w-dot' });
  add('path', { d: `M${x2 - 12} ${lineY - 11} L${x2 + 2} ${lineY} L${x2 - 12} ${lineY + 11}`, class: 'w-chev' });
  const chev = (mx) => add('path', { d: `M${mx - 5} ${lineY - 8} L${mx + 4} ${lineY} L${mx - 5} ${lineY + 8}`, class: 'w-chev' });
  for (let i = 0; i < cols.length - 1; i++) chev((cols[i].x + CW + cols[i + 1].x) / 2);
  for (const c of cols) {
    let y0 = c.beatBottom; const cx = c.x + CW / 2;
    for (const [t, b] of c.spans) { add('path', { d: `M${cx} ${y0 + 2} V${t - 2}`, class: 'w-hole' }); y0 = b; }
  }
}

/* ------------------------------------------------------------------ view (pan / zoom) */
let tx = 0, ty = 0, z = 1;
const MINZ = 0.05, MAXZ = 2.2;
const zoomPct = $('#zoomPct');
const chips = [];
function apply() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
  let s = 28 * z;
  while (s < 14) s *= 4;
  vp.style.backgroundSize = `${s}px ${s}px`;
  vp.style.backgroundPosition = `${tx}px ${ty}px`;
  zoomPct.textContent = Math.round(z * 100) + '%';
  const cx = (vp.clientWidth / 2 - tx) / z;
  let cur = 0;
  zones.forEach((zo, i) => { if (cx >= zo.x - ZGAP / 2) cur = i; });
  chips.forEach((c, i) => c.setAttribute('aria-current', i === cur ? 'true' : 'false'));
  saveViewSoon();
}
function vpPoint(clientX, clientY) { const r = vp.getBoundingClientRect(); return { x: clientX - r.left, y: clientY - r.top }; }
function zoomAt(px, py, f) {
  const nz = clamp(z * f, MINZ, MAXZ);
  tx = px - (px - tx) * (nz / z); ty = py - (py - ty) * (nz / z); z = nz; apply();
}
function centerView(rect, nz) {
  const W = vp.clientWidth, H = vp.clientHeight;
  return { z: nz, tx: W / 2 - (rect.x + rect.w / 2) * nz, ty: H / 2 - (rect.y + rect.h / 2) * nz };
}
function fitView(rect, pad = 40, maxZ = 1) {
  const W = vp.clientWidth, H = vp.clientHeight;
  const nz = clamp(Math.min((W - pad * 2) / rect.w, (H - pad * 2) / rect.h), MINZ, maxZ);
  return centerView(rect, nz);
}
let anim = 0;
function animateTo(v) {
  cancelAnimationFrame(anim);
  if (reduceMotion) { tx = v.tx; ty = v.ty; z = v.z; apply(); return Promise.resolve(); }
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = { z, cx: (W / 2 - tx) / z, cy: (H / 2 - ty) / z };
  const e = { z: v.z, cx: (W / 2 - v.tx) / v.z, cy: (H / 2 - v.ty) / v.z };
  const t0 = performance.now(), D = 560;
  return new Promise(res => {
    const step = (t) => {
      const k = Math.min(1, (t - t0) / D), q = 1 - Math.pow(1 - k, 3);
      z = Math.exp(Math.log(s.z) + (Math.log(e.z) - Math.log(s.z)) * q);
      const cx = s.cx + (e.cx - s.cx) * q, cy = s.cy + (e.cy - s.cy) * q;
      tx = W / 2 - cx * z; ty = H / 2 - cy * z; apply();
      if (k < 1) anim = requestAnimationFrame(step); else res();
    };
    anim = requestAnimationFrame(step);
  });
}
function goZone(i) {
  const zo = zones[i];
  const rect = { x: zo.x, y: 0, w: zo.w, h: zo.data.kind === 'cast' ? zo.bottom : zoneH };
  const W = vp.clientWidth, H = vp.clientHeight, pad = 32;
  const fz = Math.min((W - pad * 2) / rect.w, (H - pad * 2) / rect.h);
  if (fz >= 0.7) return animateTo(centerView(rect, Math.min(fz, 1)));

  return animateTo({ z: nz, tx: pad - rect.x * nz, ty: pad - rect.y * nz });
}
function allRect() {
  let r = { ...bounds };
  for (const n of Object.values(notes)) {
    const x2 = Math.max(r.x + r.w, n.x + 240), y2 = Math.max(r.y + r.h, n.y + 200);
    r.x = Math.min(r.x, n.x); r.y = Math.min(r.y, n.y); r.w = x2 - r.x; r.h = y2 - r.y;
  }
  return r;
}

// pointer pan + pinch
const pointers = new Map();
let pan = null, pinch = null;
vp.addEventListener('pointerdown', (e) => {
  if (e.target.closest('textarea, button, summary, a, .note-head, .hud, .hint')) return;
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  cancelAnimationFrame(anim);
  vp.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, vpPoint(e.clientX, e.clientY));
  startGesture();
  vp.classList.add('grabbing');
});
function startGesture() {
  const pts = [...pointers.values()];
  if (pts.length >= 2) {
    const [a, b] = pts;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z, wx: (mid.x - tx) / z, wy: (mid.y - ty) / z };
    pan = null;
  } else if (pts.length === 1) {
    pan = { x: pts[0].x, y: pts[0].y, tx, ty }; pinch = null;
  } else { pan = pinch = null; }
}
vp.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, vpPoint(e.clientX, e.clientY));
  const pts = [...pointers.values()];
  if (pinch && pts.length >= 2) {
    const [a, b] = pts;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, MINZ, MAXZ);
    tx = mid.x - pinch.wx * z; ty = mid.y - pinch.wy * z; apply();
  } else if (pan) {
    tx = pan.tx + pts[0].x - pan.x; ty = pan.ty + pts[0].y - pan.y; apply();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  startGesture();
  if (!pointers.size) vp.classList.remove('grabbing');
}
vp.addEventListener('pointerup', endPointer);
vp.addEventListener('pointercancel', endPointer);
vp.addEventListener('wheel', (e) => {
  e.preventDefault();
  cancelAnimationFrame(anim);
  const p = vpPoint(e.clientX, e.clientY);
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  zoomAt(p.x, p.y, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0018)));
}, { passive: false });
vp.addEventListener('scroll', () => { vp.scrollTop = 0; vp.scrollLeft = 0; });
vp.addEventListener('dblclick', (e) => {
  if (e.target.closest('.card, .note, .hud, .hint, button, textarea')) return;
  const p = vpPoint(e.clientX, e.clientY);
  addNote((p.x - tx) / z - 116, (p.y - ty) / z - 24);
});
vp.addEventListener('focusin', (e) => {
  const card = e.target.closest('.card, .note');
  if (!card) return;
  const r = card.getBoundingClientRect(), v = vp.getBoundingClientRect();
  if (r.top >= v.top && r.bottom <= v.bottom && r.left >= v.left && r.right <= v.right) return;
  const rect = { x: parseFloat(card.style.left), y: parseFloat(card.style.top), w: card.offsetWidth, h: card.offsetHeight };
  animateTo(centerView(rect, Math.max(z, 0.75)));
});
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('textarea, input')) return;
  const W = vp.clientWidth, H = vp.clientHeight;
  if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.25);
  else if (e.key === '-' || e.key === '_') zoomAt(W / 2, H / 2, 0.8);
  else if (e.key === '0') animateTo(fitView(allRect(), 40));
  else if (e.key === 'ArrowLeft') { tx += 90; apply(); }
  else if (e.key === 'ArrowRight') { tx -= 90; apply(); }
  else if (e.key === 'ArrowUp') { ty += 90; apply(); }
  else if (e.key === 'ArrowDown') { ty -= 90; apply(); }
  else return;
  e.preventDefault();
});
$('#zoomIn').addEventListener('click', () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.25));
$('#zoomOut').addEventListener('click', () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 0.8));
$('#fitAll').addEventListener('click', () => animateTo(fitView(allRect(), 40)));

const parts = $('#parts');
zones.forEach((zo, i) => {
  const b = h('button', { class: 'chip', type: 'button', text: zo.data.chip });
  b.addEventListener('click', () => goZone(i));
  parts.append(b); chips.push(b);
});

let viewTimer = 0;
function saveViewSoon() {
  clearTimeout(viewTimer);
  viewTimer = setTimeout(() => { try { localStorage.setItem('gt-board-view', JSON.stringify({ tx, ty, z })); } catch (_) {} }, 400);
}
function restoreView() {
  try {
    const v = JSON.parse(localStorage.getItem('gt-board-view') || 'null');
    if (v && [v.tx, v.ty, v.z].every(Number.isFinite) && v.z >= MINZ && v.z <= MAXZ) { tx = v.tx; ty = v.ty; z = v.z; return true; }
  } catch (_) {}
  return false;
}

/* ------------------------------------------------------------------ saving */
let db = null, mode = 'connecting', readOnly = false, pending = 0, loadedOnce = false;
const LS_H = 'gt-story-holes-v1', LS_N = 'gt-story-notes-v1';
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

function setStatus(text, warn = false) { statusEl.textContent = text; statusEl.classList.toggle('warn', warn); }
function idleStatus() {
  if (readOnly) return setStatus('View only');
  if (pending) return setStatus('Saving…');
  if (mode === 'local') return setStatus('Saving in this browser only', true);
  if (mode === 'db') return setStatus(loadedOnce ? 'All changes saved' : 'Loading your answers…');
  setStatus('Connecting…');
}

const ready = (async () => {
  let d = null;
  try { d = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch (_) { d = null; }
  db = d;
  if (!db) { mode = 'local'; loadLocal(); idleStatus(); return; }
  mode = 'db';
  try {
    const u = await window.claude.use('user');
    if (u) { const w = await u.can('data.write'); if (w === false) setReadOnly(); }
  } catch (_) {}
  subscribe();
  idleStatus();
})();

function loadLocal() {
  const hs = lsGet(LS_H) || {};
  for (const [id, text] of Object.entries(hs)) { const r = holes[id]; if (r && typeof text === 'string') { r.saved = text; r.ta.value = text; autosize(r.ta); refreshHole(r); } }
  const ns = lsGet(LS_N) || {};
  for (const [id, d] of Object.entries(ns)) if (d && Number.isFinite(d.x)) makeNote(id, d);
  scheduleLayout();
}

function subscribe() {
  const timer = setTimeout(() => { if (!loadedOnce) setStatus('Can’t reach your saved answers yet', true); }, 10000);
  db.collection('holes').onSnapshot((snap) => {
    for (const d of snap.docs) {
      const r = holes[d.id]; if (!r) continue;
      const t = (d.data() || {}).text;
      const text = typeof t === 'string' ? t : '';
      r.saved = text;
      if (document.activeElement !== r.ta && !r.timer && !r.writing) { r.ta.value = text; autosize(r.ta); }
      refreshHole(r);
    }
    if (!snap.metadata.fromCache && !loadedOnce) { loadedOnce = true; clearTimeout(timer); idleStatus(); moveLocalHoles(); }
    scheduleLayout();
  }, () => { clearTimeout(timer); setStatus('Couldn’t load saved answers', true); });
  let notesLoaded = false;
  db.collection('notes').onSnapshot((snap) => {
    const seen = new Set();
    if (!snap.metadata.fromCache && !notesLoaded) { notesLoaded = true; moveLocalNotes(new Set(snap.docs.map(d => d.id))); }
    for (const d of snap.docs) {
      const data = d.data() || {};
      seen.add(d.id);
      let n = notes[d.id];
      if (!n) { if (Number.isFinite(data.x)) makeNote(d.id, data); continue; }
      n.local = false;
      if (!n.drag && !n.writing && Number.isFinite(data.x)) { n.x = data.x; n.y = data.y; place(n.el, n.x, n.y); }
      if (document.activeElement !== n.ta && !n.timer && !n.writing) { n.ta.value = data.text || ''; autosize(n.ta); }
    }
    for (const id of Object.keys(notes)) if (!seen.has(id) && !notes[id].local) removeNoteEl(id);
  }, () => {});
}

// Answers typed while the page could only save in this browser move onto the board
// the next time it connects. A hole the board already answered keeps the board's text.
let moved = 0;
function movedStatus() { if (moved) setStatus(`Moved ${moved} from this browser onto the board`); }
async function moveLocalHoles() {
  if (readOnly) return;
  const hs = lsGet(LS_H) || {};
  for (const [id, text] of Object.entries(hs)) {
    const r = holes[id];
    if (!r || typeof text !== 'string' || !text.trim()) { delete hs[id]; continue; }
    if (r.saved.trim()) { if (r.saved === text) delete hs[id]; continue; }
    try {
      await db.collection('holes').doc(id).set({ text, updatedAt: new Date().toISOString() });
      r.saved = text;
      if (document.activeElement !== r.ta) { r.ta.value = text; autosize(r.ta); }
      refreshHole(r);
      delete hs[id]; moved++;
    } catch (_) { break; }
  }
  lsSet(LS_H, hs);
  scheduleLayout();
  movedStatus();
}
async function moveLocalNotes(onBoard) {
  if (readOnly) return;
  const ns = lsGet(LS_N) || {};
  for (const [id, d] of Object.entries(ns)) {
    if (!d || !Number.isFinite(d.x) || onBoard.has(id) || !String(d.text || '').trim()) { delete ns[id]; continue; }
    try {
      await db.collection('notes').doc(id).set({ x: Math.round(d.x), y: Math.round(d.y), text: String(d.text), updatedAt: new Date().toISOString() });
      delete ns[id]; moved++;
    } catch (_) { break; }
  }
  lsSet(LS_N, ns);
  movedStatus();
}

function setReadOnly() {
  readOnly = true;
  for (const r of Object.values(holes)) { r.ta.readOnly = true; r.ta.placeholder = 'Not filled in yet'; }
  for (const n of Object.values(notes)) n.ta.readOnly = true;
  $('#addNote').disabled = true;
  idleStatus();
}

function writeFailed(e, retry, rec) {
  const code = e && e.code;
  if (code === 'invalid_argument') { setReadOnly(); return; }
  if (code === 'quota_exceeded') { setStatus('Storage is full. Delete some notes.', true); return; }
  if (code === 'unavailable' && !rec.retried) { rec.retried = true; setTimeout(retry, 600 + Math.random() * 800); return; }
  setStatus('Couldn’t save. Type again to retry.', true);
}

// holes
function refreshHole(r) {
  const v = r.ta.value;
  r.el.classList.toggle('filled', v.trim() !== '');
  let t = v.trim() ? 'Saved' : 'Empty', warn = false;
  if (r.writing) t = 'Saving…';
  else if (v !== r.saved) { t = 'Not saved yet'; warn = mode !== 'connecting' && !r.timer; }
  if (mode === 'local' && !r.writing && v === r.saved && v.trim()) t = 'Saved in this browser';
  r.foot.textContent = t; r.foot.classList.toggle('warn', warn);
  if (r.id === 'friend-name' && friendCard) {
    const name = v.trim().split('\n')[0].slice(0, 40);
    friendCard.textContent = name || 'No name yet';
    friendCard.classList.toggle('empty', !name);
  }
  updateProgress();
}
function queueHole(r) {
  if (readOnly) return;
  clearTimeout(r.timer);
  r.timer = setTimeout(() => { r.timer = 0; flushHole(r); }, 900);
}
async function flushHole(r) {
  clearTimeout(r.timer); r.timer = 0;
  if (readOnly) return;
  await ready;
  const text = r.ta.value;
  if (text === r.saved) { refreshHole(r); return; }
  if (r.writing) { r.again = true; return; }
  r.writing = true; pending++; idleStatus(); refreshHole(r);
  try {
    if (db) await db.collection('holes').doc(r.id).set({ text, updatedAt: new Date().toISOString() });
    else { const o = lsGet(LS_H) || {}; o[r.id] = text; lsSet(LS_H, o); }
    r.saved = text; r.retried = false;
  } catch (e) { writeFailed(e, () => flushHole(r), r); }
  finally { r.writing = false; pending--; }
  if (r.again) { r.again = false; flushHole(r); } else { refreshHole(r); idleStatus(); }
}
function updateProgress() {
  const total = holeOrder.length;
  const filled = holeOrder.filter(id => holes[id].ta.value.trim()).length;
  progText.textContent = `${filled} of ${total} holes filled`;
  meter.style.width = (total ? filled / total * 100 : 0) + '%';
}
let lastHole = -1;
$('#nextHole').addEventListener('click', async () => {
  const n = holeOrder.length;
  for (let k = 1; k <= n; k++) {
    const i = (lastHole + k) % n, r = holes[holeOrder[i]];
    if (r.ta.value.trim()) continue;
    lastHole = i;
    const top = r.col.top, bottom = parseFloat(r.el.style.top) + r.el.offsetHeight;
    const rect = { x: r.col.x - 30, y: top - 30, w: CW + 60, h: bottom - top + 60 };
    const fz = clamp((vp.clientHeight - 40) / rect.h, 0.72, 1);
    await animateTo(centerView(rect, fz));
    r.ta.focus({ preventScroll: true });
    return;
  }
  setStatus('Every hole is filled');
});

// notes
const notes = {};
function makeNote(id, data) {
  const del = h('button', { class: 'note-del', type: 'button', text: 'Delete' });
  const head = h('div', { class: 'note-head' }, h('span', { text: 'Your note' }), del);
  const ta = h('textarea', { id: 'note-' + id, rows: '2', placeholder: 'Write anything…', 'aria-label': 'Your note' });
  const el = h('div', { class: 'note' }, head, ta);
  layerNotes.append(el);
  const n = { id, el, ta, x: data.x, y: data.y, writing: false, again: false, timer: 0, drag: null, local: false, retried: false };
  notes[id] = n;
  ta.value = data.text || '';
  ta.readOnly = readOnly;
  place(el, n.x, n.y);
  requestAnimationFrame(() => autosize(ta));
  ta.addEventListener('input', () => { autosize(ta); clearTimeout(n.timer); n.timer = setTimeout(() => { n.timer = 0; saveNote(n); }, 900); });
  ta.addEventListener('blur', () => { if (n.timer) { clearTimeout(n.timer); n.timer = 0; saveNote(n); } });
  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || readOnly) return;
    e.stopPropagation();
    head.setPointerCapture(e.pointerId);
    n.drag = { sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false };
    el.classList.add('lifted');
  });
  head.addEventListener('pointermove', (e) => {
    if (!n.drag) return;
    n.x = n.drag.ox + (e.clientX - n.drag.sx) / z; n.y = n.drag.oy + (e.clientY - n.drag.sy) / z;
    n.drag.moved = true; place(el, n.x, n.y);
  });
  const drop = () => { if (!n.drag) return; const moved = n.drag.moved; n.drag = null; el.classList.remove('lifted'); if (moved) saveNote(n); };
  head.addEventListener('pointerup', drop);
  head.addEventListener('pointercancel', drop);
  let armTimer = 0;
  del.addEventListener('click', async () => {
    if (readOnly) return;
    if (!del.classList.contains('armed')) {
      del.classList.add('armed'); del.textContent = 'Delete it?';
      armTimer = setTimeout(() => { del.classList.remove('armed'); del.textContent = 'Delete'; }, 3000);
      return;
    }
    clearTimeout(armTimer);
    removeNoteEl(id);
    try {
      await ready;
      if (db) await db.collection('notes').doc(id).delete();
      else { const o = lsGet(LS_N) || {}; delete o[id]; lsSet(LS_N, o); }
    } catch (e) { writeFailed(e, () => {}, n); }
  });
  return n;
}
function removeNoteEl(id) { const n = notes[id]; if (!n) return; clearTimeout(n.timer); n.el.remove(); delete notes[id]; }
async function saveNote(n) {
  if (readOnly || !notes[n.id]) return;
  await ready;
  if (n.writing) { n.again = true; return; }
  n.writing = true; pending++; idleStatus();
  const body = { x: Math.round(n.x), y: Math.round(n.y), text: n.ta.value, updatedAt: new Date().toISOString() };
  try {
    if (db) await db.collection('notes').doc(n.id).set(body);
    else { const o = lsGet(LS_N) || {}; o[n.id] = body; lsSet(LS_N, o); }
    n.retried = false;
  } catch (e) { writeFailed(e, () => saveNote(n), n); }
  finally { n.writing = false; pending--; }
  if (n.again) { n.again = false; saveNote(n); } else idleStatus();
}
async function addNote(x, y) {
  if (readOnly) return;
  await ready;
  if (readOnly) return;
  const id = db ? db.collection('notes').doc().id : 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const n = makeNote(id, { x, y, text: '' });
  n.local = true;
  n.ta.focus({ preventScroll: true });
  saveNote(n);
}
$('#addNote').addEventListener('click', () => {
  const W = vp.clientWidth, H = vp.clientHeight;
  addNote((W / 2 - tx) / z - 116, (H / 2 - ty) / z - 60);
});

// copy answers
const sheet = $('#sheet'), sheetText = $('#sheetText'), sheetMsg = $('#sheetMsg');
let sheetFrom = null;
function answersText() {
  const out = ['Govi Thena story board answers', ''];
  let filled = 0;
  holeOrder.forEach((id, i) => {
    const r = holes[id], v = r.ta.value.trim();
    if (!v) return;
    filled++;
    out.push(`${i + 1}. ${r.q}`, v, '');
  });
  if (!filled) out.push('No holes filled yet.', '');
  const ns = Object.values(notes).map(n => n.ta.value.trim()).filter(Boolean);
  if (ns.length) { out.push('Notes'); for (const t of ns) out.push('- ' + t.replace(/\n+/g, ' / ')); }
  return out.join('\n').trim();
}
function openSheet() {
  sheetFrom = document.activeElement;
  sheetText.value = answersText();
  sheetMsg.textContent = '';
  sheet.hidden = false;
  sheetText.focus(); sheetText.select();
}
function closeSheet() { sheet.hidden = true; if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); }
$('#copyAll').addEventListener('click', openSheet);
$('#sheetClose').addEventListener('click', closeSheet);
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
sheet.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } });
$('#sheetCopy').addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(sheetText.value); ok = true; } catch (_) {}
  if (!ok) { sheetText.focus(); sheetText.select(); try { ok = document.execCommand('copy'); } catch (_) {} }
  sheetMsg.textContent = ok ? 'Copied. Paste it in chat.' : 'Press Ctrl+C to copy the selected text.';
});

/* ------------------------------------------------------------------ start */
layout();
updateProgress();
let touched = restoreView();
const firstFit = () => { if (touched || vp.clientWidth < 80 || vp.clientHeight < 80) return; const v = fitView(castRect, 32, 1); tx = v.tx; ty = v.ty; z = v.z; apply(); };
for (const ev of ['pointerdown', 'wheel', 'keydown']) vp.addEventListener(ev, () => { touched = true; }, { capture: true, passive: true });
parts.addEventListener('click', () => { touched = true; }, { capture: true });
$('#nextHole').addEventListener('click', () => { touched = true; }, { capture: true });
$('#fitAll').addEventListener('click', () => { touched = true; }, { capture: true });
firstFit();
apply();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const r of Object.values(holes)) autosize(r.ta); layout(); firstFit(); });
if ('ResizeObserver' in window) new ResizeObserver(() => { firstFit(); apply(); }).observe(vp);
else window.addEventListener('resize', () => { firstFit(); apply(); });
})();
</script>
